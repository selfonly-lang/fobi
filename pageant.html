<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pageant Official Site｜SELF Pageant OS</title><style>
:root{--bg:#090507;--gold:#d8b568;--iv:#fff8ee;--mut:#b9aaa4;--line:#d8b56835}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--iv);font-family:Inter,"Noto Sans TC",system-ui}.wrap{width:min(1100px,92vw);margin:auto}header{padding:20px 0;border-bottom:1px solid var(--line)}.nav{display:flex;justify-content:space-between;align-items:center}.brand{font:25px Georgia;color:#f4d995}.hero{padding:90px 0 72px;background:radial-gradient(circle at 75% 20%,rgba(157,23,72,.3),transparent 32%)}.ey{font-size:9px;letter-spacing:.2em;color:var(--gold)}h1{font:56px Georgia;margin:10px 0}.hero p{color:var(--mut);line-height:1.7;max-width:740px}.btn{display:inline-flex;min-height:50px;align-items:center;justify-content:center;padding:0 20px;border-radius:999px;background:linear-gradient(135deg,#f5d995,#b77c2c);color:#24120d;font-weight:800;text-decoration:none}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:30px}.meta article{padding:18px;border:1px solid var(--line);border-radius:14px}.meta small{display:block;color:#a99891}.meta b{display:block;font:22px Georgia;color:#f4d995;margin-top:4px}@media(max-width:700px){.meta{grid-template-columns:1fr}h1{font-size:42px}}</style><link rel="stylesheet" href="/subpages.css"><script defer src="/subpages.js"></script></head><body><header><div class="wrap nav"><div class="brand" id="brand">PAGEANT</div><a href="/pageants.html">所有賽事</a></div></header><main><section class="hero"><div class="wrap"><div class="ey">OFFICIAL PAGEANT WEBSITE</div><h1 id="title">載入中…</h1><p id="copy">這個頁面由 SELF Pageant OS 動態產生。每一場選美比賽都可以擁有自己的官網、報名、付款、贊助、票券與後台。</p><div class="meta"><article><small>DATE</small><b id="date">—</b></article><article><small>VENUE</small><b id="venue">—</b></article><article><small>APPLICATION</small><b id="fee">—</b></article></div><p style="margin-top:26px"><a class="btn" id="apply" href="#">立即報名 →</a></p></div></section></main><script>
const API='https://tlpsqaywjcgowprhauod.supabase.co/functions/v1/pageant-public';const slug=new URLSearchParams(location.search).get('event')||'fobi-2026';fetch(API+'?resource=event&slug='+encodeURIComponent(slug)).then(r=>r.json()).then(d=>{if(!d.ok)return;const e=d.event;document.title=(e.title_zh||e.title_en||'Pageant')+'｜Official';document.getElementById('brand').textContent=e.brand_name||'PAGEANT';document.getElementById('title').textContent=e.title_zh||e.title_en||e.slug;document.getElementById('date').textContent=e.event_date||'TBA';document.getElementById('venue').textContent=e.venue||'TBA';document.getElementById('fee').textContent=Number(e.application_fee||0)===0?'依主辦公告':'NT$'+Number(e.application_fee).toLocaleString();const a=document.getElementById('apply');if(e.applications_enabled){a.href='/apply.html?event='+encodeURIComponent(e.slug);a.textContent='立即報名 →'}else{a.removeAttribute('href');a.textContent='本賽事不開放報名';a.style.opacity='.65';a.style.cursor='default'}}).catch(()=>{});
</script></body></html>
