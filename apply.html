<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SELF Pageant Apply｜選美報名</title><meta name="robots" content="noindex,nofollow"><style>
:root{--bg:#090507;--gold:#d8b568;--iv:#fff8ee;--mut:#b9aaa4;--line:#d8b56835}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--iv);font-family:Inter,"Noto Sans TC",system-ui}.wrap{width:min(900px,92vw);margin:auto}header{padding:22px 0;border-bottom:1px solid var(--line)}.brand{font:24px Georgia;color:#f4d995}.hero{padding:60px 0 28px}.ey{font-size:9px;letter-spacing:.2em;color:var(--gold)}h1{font:48px Georgia;margin:8px 0}p{color:var(--mut);line-height:1.7}.panel{background:#f3eae2;color:#2a171b;border-radius:18px;padding:26px;margin-bottom:50px}.panel p{color:#6a5b55}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}.step{padding:13px;border:1px solid #d6c4b7;border-radius:12px}.step b{display:block;color:#8d672b}.notice{background:#fff7e6;border:1px solid #d8b56866;border-radius:12px;padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px;font-size:12px}.field.full{grid-column:1/-1}.field input,.field textarea,.field select{border:1px solid #d4c4b8;background:#fffaf6;border-radius:9px;padding:12px}.field textarea{min-height:90px}.actions{display:flex;gap:8px;margin-top:18px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 18px;border-radius:999px;border:0;background:linear-gradient(135deg,#f5d995,#b77c2c);color:#24120d;font-weight:800;text-decoration:none}@media(max-width:700px){.steps,.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.actions{display:grid}.btn{width:100%}h1{font-size:39px}}</style><link rel="stylesheet" href="/subpages.css"><script defer src="/subpages.js"></script></head><body><header><div class="wrap"><div class="brand">SELF PAGEANT APPLICATION</div></div></header><main><section class="hero"><div class="wrap"><div class="ey">SELF ID REQUIRED</div><h1 id="title">選美報名</h1><p id="meta">載入賽事資訊中…</p></div></section><section class="wrap panel"><div class="steps"><article class="step"><b>01</b>SELF 登入</article><article class="step"><b>02</b>填寫報名</article><article class="step"><b>03</b>支付報名費</article><article class="step"><b>04</b>等待審核</article></div><div class="notice">佳麗正式報名需要綁定己美 SELF 會員身份，因為報名後會持續使用審核、通知、行程與 Credential；購票與企業贊助則不要求完整會員登入。</div><form class="grid" style="margin-top:18px"><label class="field">英文姓名<input disabled placeholder="Login SELF to continue"></label><label class="field">代表國家<select disabled><option>Country</option></select></label><label class="field">生日<input disabled type="date"></label><label class="field">手機<input disabled></label><label class="field full">個人介紹<textarea disabled></textarea></label></form><div class="actions"><a class="btn" href="https://www.self.com.tw/auth?redirect=%2Fmember">登入／註冊己美 SELF →</a></div><section class="wrap" style="padding:0 0 60px"><div class="notice">報名完成後，參賽者可在 SELF 會員身份下進入 Contestant Center，並於賽事期間／賽後選擇是否進一步使用 Beauty Journey、己美內容與相關服務。</div></section></main><script>
const API='https://tlpsqaywjcgowprhauod.supabase.co/functions/v1/pageant-public';const slug=new URLSearchParams(location.search).get('event')||'fobi-2026';fetch(API+'?resource=event&slug='+encodeURIComponent(slug)).then(r=>r.json()).then(d=>{if(d.ok){document.getElementById('title').textContent=d.event.title_zh||d.event.title_en||'選美報名';document.getElementById('meta').textContent=[d.event.event_date,d.event.venue,'報名費 '+(Number(d.event.application_fee||0)===0?'依主辦公告':'NT$'+Number(d.event.application_fee).toLocaleString())].filter(Boolean).join(' · ')}}).catch(()=>{});
</script></body></html>
