<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOBI｜付款結果</title><link rel="stylesheet" href="/subpages.css"><style>
:root{--bg:#090507;--gold:#d8b568;--gold2:#f6dda1;--iv:#fff8ee;--mut:#b9aaa4;--line:#d8b56835}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#35101e,#090507 62%);color:var(--iv);font-family:Inter,"Noto Sans TC",system-ui}.wrap{width:min(800px,92vw);margin:auto}.hero{padding:92px 0 30px}.ey{font-size:10px;letter-spacing:.2em;color:var(--gold)}h1{font:48px Georgia;margin:8px 0}.card{margin:20px 0 70px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#1b0c12,#0d0709);padding:28px}.status{font:36px Georgia;color:var(--gold2)}.meta{display:grid;gap:9px;margin:20px 0}.row{display:flex;justify-content:space-between;gap:18px;padding:12px 0;border-bottom:1px solid #ffffff0d}.row span{color:var(--mut)}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:999px;border:1px solid var(--line)}.gold{background:linear-gradient(180deg,#fff0bd,#ddb55b 58%,#a66f25);color:#24120d;border:0;font-weight:850}.note{color:#cdbcb4;line-height:1.7;font-size:14px}@media(max-width:700px){.row{display:grid}.actions{display:grid}.btn{width:100%}}</style></head><body><main class="wrap"><header style="padding:20px 0;border-bottom:1px solid var(--line)"><div class="wrap" style="display:flex;justify-content:space-between;align-items:center;gap:16px"><div style="font:27px Georgia;color:var(--gold2)">FOBI 2026</div><a class="btn" href="/">返回首頁</a></div></header><section class="hero"><div class="ey">PAYMENT RESULT</div><h1>FOBI 訂單狀態</h1><p class="note">系統會向 FOBI 訂單服務確認付款狀態。若金流回傳較慢，請稍候數秒再重新整理。</p></section><section class="card"><div class="status" id="status">查詢中…</div><div class="meta"><div class="row"><span>活動日期</span><b>2026.10.30</b></div><div class="row"><span>總決賽場地</span><b>臺北新板希爾頓酒店</b></div><div class="row"><span>訂單編號</span><b id="order">—</b></div><div class="row"><span>類型</span><b id="type">—</b></div><div class="row"><span>金額</span><b id="amount">—</b></div><div class="row"><span>付款時間</span><b id="paid">—</b></div></div><div id="ticketsWrap" style="display:none;margin:22px 0"><div class="ey">ENTRY TICKETS</div><h2 style="font:30px Georgia;margin:8px 0">入場序號</h2><div id="tickets" style="display:grid;gap:10px"></div><p class="note">序號格式：FB26-01-000001。FB＝FOBI、26＝2026、01＝本場次、最後 6 碼為人次流水號。</p></div><div class="actions"><a class="btn gold" href="/">回 FOBI 首頁</a><a class="btn" href="/checkout.html?type=ticket">再購買總決賽入席</a><a class="btn" href="/checkout.html?type=sponsor">企業贊助</a></div></section></main><script>
const API='https://tlpsqaywjcgowprhauod.supabase.co/functions/v1/fobi-public';const no=new URLSearchParams(location.search).get('order')||'';document.getElementById('order').textContent=no||'—';
(async()=>{if(!no){document.getElementById('status').textContent='找不到訂單編號';return}try{const r=await fetch(API+'?resource=order&order_no='+encodeURIComponent(no));const d=await r.json();if(!r.ok||!d.ok)throw new Error();const o=d.order;document.getElementById('status').textContent=o.payment_status==='paid'?'付款完成':'等待付款確認';document.getElementById('type').textContent=o.type==='sponsor'?'企業國家贊助':'總決賽入席';document.getElementById('amount').textContent='NT$'+Number(o.amount||0).toLocaleString();document.getElementById('paid').textContent=o.paid_at?new Date(o.paid_at).toLocaleString('zh-TW'):'尚未確認';if(d.tickets?.length){const w=document.getElementById('ticketsWrap'),box=document.getElementById('tickets');w.style.display='block';box.innerHTML='';d.tickets.forEach((t,i)=>{const row=document.createElement('div');row.style.cssText='display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:#12090d';row.innerHTML='<span>第 '+(i+1)+' 位 · '+(t.ticket_type||'TICKET')+(t.afterparty_entitlement?' · After Party':'')+'</span><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end"><b style="font:24px Georgia;color:var(--gold2)">'+t.ticket_no+'</b>'+(t.qr_token?'<a class="btn" style="min-height:38px;padding:0 13px;font-size:12px" href="/ticket.html?token='+encodeURIComponent(t.qr_token)+'">開啟電子票</a>':'')+'</div>';box.appendChild(row)})}}catch{document.getElementById('status').textContent='暫時無法取得訂單狀態'}})();
</script></body></html>
