<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOBI 2026｜現場報到</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#090507;--gold:#d8b568;--iv:#fff8ee;--mut:#b9aaa4;--line:#d8b56835}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--iv);font-family:Inter,"Noto Sans TC",system-ui}
.wrap{width:min(720px,92vw);margin:auto}.top{padding:24px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
h1{font:46px Georgia;margin:56px 0 10px}.muted{color:var(--mut);line-height:1.7}
.panel{margin:28px 0 70px;padding:24px;border:1px solid var(--line);border-radius:18px;background:#130a0e}
label{display:grid;gap:7px;margin:15px 0}input,select{height:54px;border-radius:10px;border:1px solid #3b2a30;background:#fffaf5;color:#231219;padding:0 12px;font-size:16px}
button{width:100%;height:56px;border:0;border-radius:999px;background:linear-gradient(#fff0bd,#d8b568);font-weight:900;font-size:17px}
#result{display:none;margin-top:18px;padding:18px;border-radius:12px;border:1px solid var(--line)}#result.show{display:block}.ok{background:#0f2f20}.bad{background:#33141b}
</style>
<link rel="stylesheet" href="/subpages.css"></head>
<body>
<div class="wrap">
<div class="top"><b>FOBI CHECK-IN</b><a href="/admin.html" style="color:var(--gold)">管理後台</a></div>
<h1>現場報到</h1>
<p class="muted">工作人員專用。每張票只可核銷一次；重複掃描會顯示已報到。</p>
<p class="muted">2026.10.30 · 總決賽場地：臺北新板希爾頓酒店</p>
<div class="panel">
<label>票券 QR Token<input id="token" placeholder="掃描後貼上 token"></label>
<label>報到入口<select id="gate"><option value="MAIN">MAIN</option><option value="VIP">VIP</option><option value="AFTERPARTY">AFTER PARTY</option></select></label>
<button id="go">確認報到</button>
<div id="result"></div>
</div>
</div>
<script>
const ADMIN='https://tlpsqaywjcgowprhauod.supabase.co/functions/v1/fobi-admin';
const q=new URLSearchParams(location.search);document.getElementById('token').value=q.get('token')||'';
function adminToken(){return sessionStorage.getItem('fobi_admin_token')||localStorage.getItem('fobi_admin_token')||''}
document.getElementById('go').onclick=async()=>{
 const box=document.getElementById('result');box.className='';box.classList.add('show');
 const key=adminToken();if(!key){box.classList.add('bad');box.innerHTML='<b>需要管理員登入</b><p>請先從 FOBI 後台完成管理員登入。</p>';return}
 try{
  const r=await fetch(ADMIN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({action:'ticket_checkin',qr_token:document.getElementById('token').value.trim(),gate:document.getElementById('gate').value})});
  const d=await r.json();
  box.classList.add(d.ok?'ok':'bad');
  box.innerHTML=d.ok?'<b>報到成功</b><p>'+d.ticket_no+' · '+(d.holder_name||'未命名')+'</p>':'<b>'+(d.error==='already_checked_in'?'已經報到':'無法報到')+'</b><p>'+(d.ticket_no||'請確認票券')+'</p>';
 }catch(e){box.classList.add('bad');box.innerHTML='<b>連線失敗</b>'}
};
</script>
</body></html>
