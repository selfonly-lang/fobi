<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOBI 2026｜官方合作夥伴</title><meta name="description" content="FOBI 2026 官方贊助夥伴與品牌曝光名錄"><link rel="stylesheet" href="/subpages.css"><style>:root{--bg:#090507;--gold:#d8b568;--gold2:#f6dda1;--iv:#fff8ee;--mut:#b9aaa4;--line:#d8b56835}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#35101e,#090507 60%);color:var(--iv);font-family:Inter,"Noto Sans TC",system-ui}.wrap{width:min(1120px,92vw);margin:auto}.nav{min-height:76px;display:flex;align-items:center;justify-content:space-between}.brand{font:27px Georgia;color:var(--gold2)}.links{display:flex;gap:22px;align-items:center}.links a{font-size:15px;font-weight:700}.hero{padding:80px 0 40px}.ey{font-size:10px;letter-spacing:.2em;color:var(--gold)}h1{font:54px Georgia;margin:8px 0}.hero p{color:var(--mut);max-width:760px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:15px 0 70px}.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#1a0c11,#0d0709);padding:20px;display:grid;grid-template-columns:80px 1fr;gap:16px;align-items:center}.logo{width:80px;height:80px;border-radius:14px;background:#fff8ee;display:grid;place-items:center;overflow:hidden;color:#7c5c28}.logo img{width:100%;height:100%;object-fit:contain;padding:10px}.card h2{font:24px Georgia;margin:4px 0}.card small{color:var(--gold);font-size:9px;letter-spacing:.16em}.card p{color:var(--mut);font-size:13px;line-height:1.55}.empty{padding:30px;border:1px dashed var(--line);border-radius:18px;color:var(--mut)}.btn{display:inline-flex;min-height:50px;align-items:center;padding:0 18px;border-radius:999px;border:1px solid var(--line)}.gold{background:linear-gradient(180deg,#fff0bd,#ddb55b 58%,#a66f25);color:#24120d;border:0;font-weight:900}@media(max-width:850px){.grid{grid-template-columns:1fr}.links a:not(.gold){display:none}.card{grid-template-columns:70px 1fr}.logo{width:70px;height:70px}}</style></head><body><header><div class="wrap nav"><div class="brand">FOBI 2026</div><div class="links"><a href="/">首頁</a><a href="/sponsors.html">品牌贊助</a><a href="/event.html">活動資訊</a><a class="btn gold" href="/checkout.html?type=sponsor">成為贊助夥伴</a></div></div></header><main><section class="hero wrap"><div class="ey">OFFICIAL PARTNERS</div><h1>官方合作夥伴</h1><p>FOBI 2026 官方贊助品牌名錄。品牌卡片與官網連結由活動後台統一管理，並可依合作方案安排 FOBI 官方內容、現場品牌識別與合作媒體延伸曝光。</p></section><section class="wrap"><div id="grid" class="grid"></div></section></main><script>const API='https://tlpsqaywjcgowprhauod.supabase.co/functions/v1/fobi-public';(async()=>{const g=document.getElementById('grid');try{const r=await fetch(API+'?resource=sponsors');const d=await r.json();const x=d.items||[];if(!x.length){g.innerHTML='<div class="empty">官方合作夥伴名錄將由活動後台陸續公開。</div>';return}x.forEach(s=>{const a=document.createElement('a');a.className='card';a.href=s.website_url||'#';if(s.website_url){a.target='_blank';a.rel='noreferrer'};a.innerHTML='<div class="logo">'+(s.logo_url?'<img src="'+s.logo_url+'" alt="'+s.name+'">':'FOBI')+'</div><div><small>'+(s.tier||'PARTNER')+'</small><h2>'+s.name+'</h2><p>'+(s.description||'FOBI 2026 官方合作夥伴')+'</p></div>';g.appendChild(a)})}catch{g.innerHTML='<div class="empty">目前無法載入合作夥伴名錄。</div>'}})();</script></body></html>
