<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOBI 2026｜40國佳麗</title><meta name="description" content="40國佳麗與國家桌即時狀態"><style>
:root{--bg:#0b0709;--wine:#5c1533;--ruby:#9b1749;--gold:#d9b66c;--gold2:#f3d99b;--ivory:#fff8f1;--muted:#b9aaa4;--line:#ffffff18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#2a0d19 0,#10070b 38%,#090608 78%);color:var(--ivory);font-family:Inter,"Noto Sans TC","PingFang TC",system-ui,sans-serif}a{text-decoration:none;color:inherit}.wrap{width:min(1180px,88vw);margin:auto}header{position:sticky;top:0;z-index:20;background:#0b0709e8;backdrop-filter:blur(16px);border-bottom:1px solid rgba(217,182,108,.18)}.nav{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font:600 22px Georgia;color:var(--gold2)}.brand small{font:700 10px Inter;color:var(--gold);letter-spacing:.15em}.links{display:flex;gap:22px}.links a{font-size:13px;color:#d7c8c2}.hero{padding:90px 0 56px;background:radial-gradient(circle at 75% 20%,rgba(150,25,73,.45),transparent 34%)}.eyebrow{font-size:10px;letter-spacing:.22em;color:var(--gold);font-weight:800}.hero h1,.section h2{font:400 clamp(42px,6vw,76px)/1.02 Georgia;margin:14px 0}.hero p{max-width:740px;color:#b9aaa4;line-height:1.8}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 22px;border-radius:999px;border:1px solid #ffffff24}.gold{background:linear-gradient(135deg,#f6dda1,#d9b66c 48%,#ad792f);color:#1b0d0d;font-weight:800}.pink{background:linear-gradient(135deg,#ff5aa4,#c50f5a);color:#fff;font-weight:800;border:0}.section{padding:76px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{border:1px solid rgba(217,182,108,.24);background:linear-gradient(145deg,rgba(72,15,40,.78),rgba(17,7,12,.94));border-radius:22px;padding:26px;box-shadow:inset 0 1px 0 #fff1,0 20px 60px #0003}.card h3{font:28px Georgia;margin:10px 0}.card p{color:#b9aaa4;line-height:1.7}.light{background:linear-gradient(180deg,#f5ece4,#eaded5);color:#28151a}.light .eyebrow{color:#8e641d}.light .card{background:linear-gradient(160deg,#fffaf5,#efe1d7);border-color:#d9c7ba;color:#28151a}.status{font-size:10px;letter-spacing:.12em;color:#3b8c60}.muted{color:#9f918c}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:80px 1fr 1fr;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}.row b{font:22px Georgia}.faq{display:grid;grid-template-columns:1fr 1fr;gap:12px}.faq details{border:1px solid rgba(217,182,108,.2);border-radius:16px;padding:20px;background:#15090f}.faq p{color:#a99a95;line-height:1.7}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}footer{padding:28px 0;border-top:1px solid var(--line);color:#756a6b;font-size:11px}.foot{display:flex;justify-content:space-between}@media(max-width:800px){.links{display:none}.grid,.faq{grid-template-columns:1fr}.row{grid-template-columns:60px 1fr}.row>*:last-child{grid-column:2}.hero{padding-top:64px}.foot{display:grid;gap:8px;text-align:center}}
</style></head><body><header><div class="wrap nav"><a class="brand" href="/">FOBI <small>2026</small></a><nav class="links"><a href="/contestants.html">40國佳麗</a><a href="/#countries">企業認桌</a><a href="/sponsors.html">品牌合作</a><a href="/tickets.html">會員贊助</a><a href="/event.html">活動資訊</a></nav></div></header>
<section class="hero"><div class="wrap"><div class="eyebrow">COUNTRIES & CONTESTANTS</div><h1>40 國佳麗，<br>一桌代表一個國家。</h1><p>FOBI 40 國佳麗與國家桌即時同步。企業可認領尚未被贊助的國家桌；活動同時納入己美 VIP 聯盟國際交流體驗。</p><div class="actions"><a class="btn gold" href="/#countries">立即認桌</a><a class="btn" href="/event.html">查看活動流程</a></div></div></section>
<section class="section light"><div class="wrap"><div class="eyebrow">LIVE COUNTRY INVENTORY</div><h2>國家桌即時狀態</h2><div id="grid" class="grid"></div></div></section>
<script>
const API='https://tlpsqaywjcgowprhauod.supabase.co/functions/v1/fobi-public';
const flag=c=>String(c||'').toUpperCase().replace(/./g,ch=>String.fromCodePoint(127397+ch.charCodeAt(0)));
(async()=>{const g=document.getElementById('grid');g.innerHTML='<p>同步中…</p>';try{const r=await fetch(API+'?resource=countries');const d=await r.json();g.innerHTML='';(d.countries||[]).forEach(x=>{const a=document.createElement('article');a.className='card';a.innerHTML='<div style="font-size:34px">'+flag(x.code)+'</div><h3>'+x.name_en+'</h3><p>Table '+String(x.table_no).padStart(2,'0')+'</p><span class="status">'+x.status.toUpperCase()+'</span>';if(x.status==='available')a.innerHTML+='<div class="actions"><a class="btn gold" href="/#countries">認領此國家</a></div>';g.appendChild(a)})}catch(e){g.innerHTML='<p>目前無法同步國家桌。</p>'}})();
</script><footer><div class="wrap foot"><b>FOBI 2026</b><span>Face of Beauty International · Taipei</span><span>2026.10.30</span></div></footer></body></html>
