<section class="section light"><div class="wrap"><div class="eyebrow">LIVE INVENTORY</div><h2>國家桌即時狀態</h2><div id="grid" class="countryGrid"></div></div></section>
<script>
const API='https://tlpsqaywjcgowprhauod.supabase.co/functions/v1/fobi-public';
const flag=c=>String(c||'').toUpperCase().replace(/./g,ch=>String.fromCodePoint(127397+ch.charCodeAt(0)));
(async()=>{const g=document.getElementById('grid');g.innerHTML='<p>同步中…</p>';try{const r=await fetch(API+'?resource=countries');const d=await r.json();g.innerHTML='';(d.countries||[]).forEach(x=>{const a=document.createElement('article');a.className='countryCard';a.innerHTML='<div class="flag">'+flag(x.code)+'</div><h3>'+x.name_en+'</h3><small>Table '+String(x.table_no).padStart(2,'0')+' · '+x.status.toUpperCase()+'</small>'+(x.status==='available'?'<a class="btn gold" href="/checkout.html?type=sponsor">認領此國家</a>':'');g.appendChild(a)})}catch(e){g.innerHTML='<p>目前無法同步國家桌。</p>'}})();
</script><footer><div class="wrap foot"><b>FOBI 2026</b><span>Face of Beauty International · Taipei</span><span>2026.10.30</span></div></footer></body></html>
