<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SELF Pageants｜選美賽事</title><meta name="description" content="己美 SELF 選美賽事平台：瀏覽可報名的選美比賽、查看活動官網並進入報名流程。"><style>
:root{--bg:#090507;--gold:#d8b568;--iv:#fff8ee;--mut:#b9aaa4;--line:#d8b56835}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--iv);font-family:Inter,"Noto Sans TC",system-ui}.wrap{width:min(1100px,92vw);margin:auto}header{padding:22px 0;border-bottom:1px solid var(--line)}.nav{display:flex;justify-content:space-between;align-items:center}.brand{font:25px Georgia;color:#f4d995}.brand small{display:block;font:8px Inter;letter-spacing:.2em}.hero{padding:70px 0 36px}.ey{font-size:9px;letter-spacing:.2em;color:var(--gold)}h1{font:52px Georgia;margin:8px 0}p{color:var(--mut);line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0 70px}.card{border:1px solid var(--line);background:linear-gradient(145deg,#1a0c11,#0d0709);border-radius:18px;padding:22px}.card h2{font:26px Georgia;margin:8px 0}.meta{font-size:12px;color:#d9c9c2;line-height:1.8}.actions{display:flex;gap:8px;margin-top:18px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border-radius:999px;border:1px solid var(--line);color:#f4d58f;text-decoration:none;font-size:12px}.gold{background:linear-gradient(135deg,#f5d995,#b77c2c);color:#23120c;border:0;font-weight:800}@media(max-width:760px){.grid{grid-template-columns:1fr}.actions{display:grid}.btn{width:100%}h1{font-size:40px}}</style></head><body><header><div class="wrap nav"><div class="brand">SELF PAGEANTS<small>POWERED BY SELF ID</small></div><a class="btn" href="/">FOBI 2026</a></div></header><main><section class="hero"><div class="wrap"><div class="ey">DISCOVER · APPLY · PAY · COMPETE</div><h1>參加不同的選美比賽。</h1><p>同一個己美 SELF 會員身份，瀏覽賽事、報名、付款、審核、行程與現場 Credential。每一場賽事都可擁有自己的官方網站。</p></div></section><section class="wrap"><div id="grid" class="grid"><p>載入賽事中…</p></div></section></main><script>
const API='https://tlpsqaywjcgowprhauod.supabase.co/functions/v1/pageant-public';
(async()=>{const g=document.getElementById('grid');try{const r=await fetch(API+'?resource=events');const d=await r.json();g.innerHTML='';(d.events||[]).forEach(e=>{const a=document.createElement('article');a.className='card';a.innerHTML='<div class="ey">'+(e.brand_name||'PAGEANT')+'</div><h2>'+(e.title_zh||e.title_en||e.slug)+'</h2><div class="meta">'+(e.event_date||'日期待公告')+'<br>'+(e.venue||'場地待公告')+'<br>報名費：'+(Number(e.application_fee||0)===0?'依主辦公告':'NT$'+Number(e.application_fee).toLocaleString())+'</div><div class="actions"><a class="btn" href="/pageant.html?event='+encodeURIComponent(e.slug)+'">官方網站</a><a class="btn gold" href="/apply.html?event='+encodeURIComponent(e.slug)+'">立即報名</a></div>';g.appendChild(a)});if(!(d.events||[]).length)g.innerHTML='<p>目前沒有開放中的賽事。</p>'}catch{g.innerHTML='<p>賽事資料暫時無法載入。</p>'}})();
</script></body></html>
