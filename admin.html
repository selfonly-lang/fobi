<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOBI Admin</title><style>body{margin:0;background:#10070b;color:#f5eee7;font-family:system-ui}.w{width:min(1100px,92vw);margin:auto;padding:50px 0}h1{font:46px Georgia;color:#d8b66c}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.c{padding:20px;background:#1a0b12;border:1px solid #ffffff18}.c b{font-size:28px;display:block}.bar{display:flex;justify-content:space-between;align-items:center}.btn{padding:11px 15px;background:#d8b66c;color:#1b0d0e;border:0}.tbl{margin-top:24px;border:1px solid #ffffff18}.row{display:grid;grid-template-columns:70px 1fr 120px 1fr;padding:12px;border-bottom:1px solid #ffffff12}.muted{color:#a99a95}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}.row{grid-template-columns:50px 1fr 100px}}</style></head><body><div class="w"><div class="bar"><div><div style="color:#d8b66c;letter-spacing:.2em;font-size:11px">FOBI 2026</div><h1>Event Command Center</h1></div><a class="btn" href="/">回官網</a></div><div class="cards"><div class="c"><span class="muted">國家桌</span><b id="total">40</b></div><div class="c"><span class="muted">可認領</span><b id="avail">--</b></div><div class="c"><span class="muted">已保留</span><b id="reserved">--</b></div><div class="c"><span class="muted">已贊助</span><b id="sponsored">--</b></div></div><div class="tbl" id="list"><div class="row"><b>#</b><b>Country</b><b>Status</b><b>Sponsor</b></div></div><p class="muted">已連接 FOBI Supabase 即時國家桌資料。認桌狀態將由資料庫同步顯示。</p></div><script>async function load(){try{const r=await fetch('https://tlpsqaywjcgowprhauod.supabase.co/functions/v1/fobi-public?resource=countries'),d=await r.json();if(!d.ok)return;const c=d.countries;document.getElementById('total').textContent=c.length;document.getElementById('avail').textContent=c.filter(x=>x.status==='available').length;document.getElementById('reserved').textContent=c.filter(x=>x.status==='reserved').length;document.getElementById('sponsored').textContent=c.filter(x=>x.status==='sponsored').length;const list=document.getElementById('list');c.forEach(x=>{const e=document.createElement('div');e.className='row';e.innerHTML='<span>'+x.table_no+'</span><b>'+x.name_en+'</b><span>'+x.status+'</span><span>'+(x.sponsor_name||'—')+'</span>';list.appendChild(e)})}catch(e){}}load()</script></body></html>
