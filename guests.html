<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOBI 2026｜參與會員與貴賓</title><meta name="description" content="FOBI 2026 參與會員與貴賓公開名錄"><link rel="stylesheet" href="/subpages.css"><style>:root{--bg:#090507;--gold:#d8b568;--gold2:#f6dda1;--iv:#fff8ee;--mut:#b9aaa4;--line:#d8b56835}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#401126,#090507 62%);color:var(--iv);font-family:Inter,"Noto Sans TC",system-ui}.wrap{width:min(1120px,92vw);margin:auto}.nav{min-height:76px;display:flex;align-items:center;justify-content:space-between}.brand{font:27px Georgia;color:var(--gold2)}.links{display:flex;gap:22px;align-items:center}.links a{font-size:15px;font-weight:700}.hero{padding:80px 0 40px}.ey{font-size:10px;letter-spacing:.2em;color:var(--gold)}h1{font:54px Georgia;margin:8px 0}.hero p{color:var(--mut);max-width:760px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;padding:16px 0 70px}.person{text-align:center;display:grid;justify-items:center;gap:7px}.avatar{width:112px;height:112px;border-radius:50%;overflow:hidden;border:2px solid #d8b56899;background:#1a0c11;display:grid;place-items:center;font:28px Georgia;color:var(--gold2)}.avatar img{width:100%;height:100%;object-fit:cover}.person b{font-size:14px}.person small{font-size:11px;color:var(--mut)}.empty{grid-column:1/-1;padding:30px;border:1px dashed var(--line);border-radius:18px;color:var(--mut)}.btn{display:inline-flex;min-height:50px;align-items:center;padding:0 18px;border-radius:999px;border:1px solid var(--line)}.gold{background:linear-gradient(180deg,#fff0bd,#ddb55b 58%,#a66f25);color:#24120d;border:0;font-weight:900}@media(max-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:600px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}.avatar{width:82px;height:82px}.links a:not(.gold){display:none}}</style></head><body><header><div class="wrap nav"><div class="brand">FOBI 2026</div><div class="links"><a href="/">首頁</a><a href="/event.html">活動資訊</a><a class="btn gold" href="/checkout.html?type=ticket">參加總決賽</a></div></div></header><main><section class="hero wrap"><div class="ey">VIP GUESTS & MEMBERS</div><h1>參與會員與貴賓</h1><p>經本人同意公開的 FOBI 參與會員與貴賓將以頭像方式呈現。此名錄與購票、贊助資料分開管理，未經同意不公開。</p></section><section class="wrap"><div id="grid" class="grid"></div></section></main><script>const API='https://tlpsqaywjcgowprhauod.supabase.co/functions/v1/fobi-public';(async()=>{const g=document.getElementById('grid');try{const r=await fetch(API+'?resource=participants');const d=await r.json();const x=d.items||[];if(!x.length){g.innerHTML='<div class="empty">參與會員／貴賓名錄將在取得公開同意後顯示。</div>';return}x.forEach(p=>{const a=document.createElement('a');a.className='person';a.href=p.profile_url||'#';a.innerHTML='<span class="avatar">'+(p.avatar_url?'<img src="'+p.avatar_url+'" alt="'+p.display_name+'">':(p.display_name||'V').slice(0,1))+'</span><b>'+p.display_name+'</b><small>'+(p.subtitle||p.country_code||'')+'</small>';g.appendChild(a)})}catch{g.innerHTML='<div class="empty">目前無法載入參與名錄。</div>'}})();</script></body></html>
